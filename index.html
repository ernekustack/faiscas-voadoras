<title>Ateliers Faíscas Voadoras – Metalurgia e Forja em Colos, Odemira</title>

<style>
:root{
  --bg:#121110; --bg2:#1a1816; --card:#201d1a; --line:#332e29;
  --text:#efe6da; --muted:#a89d90; --fire:#e8731a; --fire2:#ffb25b;
  --head:Georgia,"Times New Roman",serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--body);line-height:1.65;font-size:17px}
img{max-width:100%;display:block}
a{color:var(--fire2)}
.wrap{max-width:1120px;margin:0 auto;padding:0 22px}
h1,h2,h3{font-family:var(--head);font-weight:700;line-height:1.15}
h2{font-size:clamp(28px,4vw,42px);margin-bottom:14px}
h2::after{content:"";display:block;width:56px;height:3px;background:var(--fire);margin-top:14px}
section{padding:84px 0}
.alt{background:var(--bg2)}
.lead{color:var(--muted);max-width:680px;margin-bottom:34px}

/* Header */
header{position:fixed;top:0;left:0;right:0;z-index:20;background:rgba(18,17,16,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;height:64px;gap:16px}
.logo{font-family:var(--head);font-weight:700;font-size:18px;color:var(--text);text-decoration:none;letter-spacing:.04em;text-transform:uppercase}
.logo span{color:var(--fire)}
nav{display:flex;gap:22px;align-items:center}
nav a{color:var(--text);text-decoration:none;font-size:15px}
nav a:hover{color:var(--fire2)}
.lang{display:flex;gap:4px}
.lang button{background:none;border:1px solid var(--line);color:var(--muted);padding:0 9px;height:34px;line-height:1;border-radius:4px;cursor:pointer;font-size:13px;font-weight:600}
.lang button.on{background:var(--fire);border-color:var(--fire);color:#111}
nav a.app{background:var(--fire);color:#111;padding:0 14px;height:34px;display:inline-flex;align-items:center;line-height:1;white-space:nowrap;border-radius:4px;font-weight:700}
nav a.app:hover{background:var(--fire2);color:#111}
@media(max-width:820px){nav a{display:none}nav a.app{display:inline-flex;height:30px;padding:0 10px;font-size:13px}nav .lang{display:none}
.bar{gap:8px}.lang button{height:30px;padding:0 7px}.logo{font-size:14px;letter-spacing:.02em;white-space:nowrap;min-width:0}}
@media(max-width:480px){.wrap{padding:0 14px}.logo{font-size:11.5px}.lang{gap:3px}.lang button{padding:0 5px;font-size:12px}nav a.app{padding:0 8px;font-size:12px}}
@media(max-width:600px){.hero .btn.ghost{margin-left:0;margin-top:12px}}

/* Hero */
.hero{position:relative;min-height:100vh;display:flex;align-items:center;overflow:hidden;
  background:radial-gradient(ellipse at 70% 90%,rgba(232,115,26,.28),transparent 55%),var(--bg);padding-top:64px}
.hero img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55}
#sparks{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hero .wrap{position:relative;z-index:2;width:100%}
.kicker{color:var(--fire2);letter-spacing:.2em;text-transform:uppercase;font-size:13px;font-weight:600;margin-bottom:18px}
.hero h1{font-size:clamp(40px,8vw,84px);text-transform:uppercase;letter-spacing:.02em;margin-bottom:22px}
.hero h1 em{color:var(--fire);font-style:normal}
.hero p{font-size:20px;color:#d8cdbf;max-width:620px;margin-bottom:34px}
.btn{display:inline-block;background:var(--fire);color:#111;padding:14px 28px;border-radius:4px;font-weight:700;text-decoration:none;border:0;font-size:16px;cursor:pointer;font-family:inherit}
.btn:hover{background:var(--fire2)}
.btn.ghost{background:none;border:1px solid var(--fire);color:var(--fire2);margin-left:10px}
.btn.ghost:hover{background:rgba(232,115,26,.15)}

/* Cards */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:26px}
.card h3{font-size:21px;margin-bottom:8px;color:var(--fire2)}
.card p{color:var(--muted);font-size:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:44px;align-items:center}
@media(max-width:820px){.two{grid-template-columns:1fr}}
.two p+p{margin-top:14px}

/* Gallery */
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.ph{position:relative;aspect-ratio:4/3;background:linear-gradient(135deg,#26211c,#17140f);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.ph video{width:100%;height:100%;object-fit:cover;display:block;background:#000}
#aboutImg{aspect-ratio:16/9}
.ph:hover img{transform:scale(1.05)}
.ph span{position:absolute;left:0;right:0;bottom:0;padding:26px 12px 10px;background:linear-gradient(transparent,rgba(0,0,0,.8));font-size:14px}
.ph.empty::before{content:"📷";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:34px;opacity:.25}

/* Contact */
.contact{display:grid;grid-template-columns:1fr 1.2fr;gap:44px}
@media(max-width:820px){.contact{grid-template-columns:1fr}}
.info p{margin-bottom:12px}
.info strong{display:block;color:var(--fire2);font-size:13px;letter-spacing:.12em;text-transform:uppercase}
form{display:grid;gap:14px}
input,textarea{width:100%;background:var(--card);border:1px solid var(--line);color:var(--text);padding:13px;border-radius:4px;font:inherit}
input:focus,textarea:focus{outline:2px solid var(--fire);border-color:var(--fire)}
textarea{min-height:130px;resize:vertical}
.hp{position:absolute;left:-9999px}
.small{font-size:13px;color:var(--muted)}
footer{border-top:1px solid var(--line);padding:30px 0;color:var(--muted);font-size:14px}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px}
#privacy{display:none;margin-top:20px;padding:20px;background:var(--card);border:1px solid var(--line);border-radius:6px}
#privacy:target{display:block}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.ph img{transition:none}}
</style>
</head>

var lang="pt";
function setLang(l){
  if(!T[l])l="pt"; lang=l;
  document.documentElement.lang=l;
  document.querySelectorAll("[data-i18n]").forEach(function(e){e.textContent=T[l][e.getAttribute("data-i18n")]||""});
  document.querySelectorAll("[data-i18n-ph]").forEach(function(e){e.placeholder=T[l][e.getAttribute("data-i18n-ph")]||""});
  document.querySelectorAll(".lang button").forEach(function(b){b.classList.toggle("on",b.getAttribute("data-l")===l)});
  document.querySelectorAll("#gal .ph").forEach(function(f){var t=GAL[+f.getAttribute("data-i")][1][l];f.querySelector("span").textContent=t;var im=f.querySelector("img");if(im)im.alt=t});
  try{localStorage.setItem("lang",l)}catch(e){}
}

  d.innerHTML='<img loading="lazy" src="img/'+it[0]+'" alt=""><span></span>';
  d.querySelector("img").onerror=function(){d.remove()};

});

// Video-Platz: fehlt oficina.mp4, Bild oder Platzhalter zeigen
(function(){
  var v=document.getElementById("aboutVid"),src=v&&v.querySelector("source");
  if(!src)return;
  // Autostart beim Hineinscrollen, Pause beim Verlassen
  if("IntersectionObserver" in window){
    v.muted=true;
    new IntersectionObserver(function(es){
      es.forEach(function(e){
        if(e.isIntersecting){var pr=v.play();if(pr&&pr.catch)pr.catch(function(){})}
        else v.pause();
      });
    },{threshold:0.5}).observe(v);
  }
  src.addEventListener("error",function(){
    var box=document.getElementById("aboutImg");
    box.innerHTML='<img src="img/oficina.jpg" alt="Ateliers Faíscas Voadoras">';
    box.querySelector("img").onerror=function(){box.classList.add("empty");this.remove()};
  });
})();

// Funken
(function(){
  if(window.matchMedia("(prefers-reduced-motion:reduce)").matches)return;
  var c=document.getElementById("sparks"),x=c.getContext("2d"),P=[],W,H;
  function rs(){W=c.width=c.offsetWidth;H=c.height=c.offsetHeight}
  rs();window.addEventListener("resize",rs);
  function add(){P.push({x:W*(.55+Math.random()*.45),y:H+10,vx:(Math.random()-.7)*1.4,vy:-(1+Math.random()*2.6),l:1,s:1+Math.random()*2})}
  function loop(){
    x.clearRect(0,0,W,H);
    if(P.length<70&&Math.random()<.5)add();
    for(var i=P.length-1;i>=0;i--){
      var p=P[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.005;p.l-=.006;
      if(p.l<=0){P.splice(i,1);continue}
      x.globalAlpha=p.l;x.fillStyle=p.l>.5?"#ffb25b":"#e8731a";
      x.beginPath();x.arc(p.x,p.y,p.s,0,6.283);x.fill();
    }
    requestAnimationFrame(loop);
  }
  loop();
})();
</script>
